//.\protoc-36.2-win64\bin\protoc.exe -I . -I protoc-36.2-win64\include --java_out=src proto\DatabaseComms.proto

syntax = "proto3";
package DatabaseProto;

option java_multiple_files = true;

message DatabaseRequest {
    Operation operation = 1;
    optional int32 getParameter = 2;
    optional PutParameters putParameters = 3;
}

message PutParameters {
    int32 key = 1;
    string value = 2;
}

message DatabaseReply {
    Operation operation = 1;
    string responseText = 2;
    optional string getResponseValue = 3;
    optional int32 sizeResponseValue = 4;
}

enum Operation {
    UNDEFINED = 0;
    GET = 1;
    PUT = 2;
    SIZE = 3;
}